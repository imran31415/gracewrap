name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26', '1.27']
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: '**/go.sum'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Run tests with race detector
      run: go test -race -v ./...
    
    - name: Generate coverage report
      run: go test -coverprofile=coverage.out ./...
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Test examples build
      run: |
        cd examples/http_server && go build .
        cd ../grpc_server && go build .
        cd ../mixed_service && go build .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    
    - name: Run Security Checks
      run: |
        # Use go vet for basic security checks
        go vet ./...
        
        # Try to install and run gosec
        go install github.com/securego/gosec/v2/cmd/gosec@latest || echo "gosec install failed, skipping"
        gosec ./... || echo "gosec scan completed with warnings"
    
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
